# "Green" on every push and pull request (INVARIANT 26, TRD §1): lint, typecheck, tests, unused-code check, build, then
# the browser checks (axe + flows, D-049) against the build just made.
# Created locally (D-033); the repo has no remote yet, and pushing needs Sasanka's permission (D-015).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run unused
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
