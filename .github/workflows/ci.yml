# "Green" on every push and pull request (INVARIANT 26, TRD §1): lint, typecheck, tests, unused-code check, build, then
# the browser checks (axe + flows, D-049) against the build just made.
# Created locally (D-033); the repo has no remote yet, and pushing needs Sasanka's permission (D-015).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # PostgreSQL 18 is the current stable major; CI proofs only, not a host/driver decision.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: care_setu_backend_test
          # Ephemeral CI-only service; no production credential or secret.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d care_setu_backend_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgres://postgres@127.0.0.1:5432/care_setu_backend_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Required backend proofs strengthen CI; no existing checker is loosened.
      - run: npm run test:backend
      - run: npm test
      - run: npm run unused
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
